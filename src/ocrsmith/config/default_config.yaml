# text_data:
#   source_type: 'csv'
#   source_path: 'assets/text_data/sentences.csv'
#   text_column: 'darija_ar'


text_data:
  source_type: 'huggingface'
  source_path: 'atlasia/Moroccan-Darija-Wiki-Dataset'
  text_column: 'content'
  title_column: 'title'

backgrounds:
  # Image Backgrounds
  - type: image
    image_path: "assets/backgrounds/white_paper.jpg"
    mode: crop
  - type: image
    image_path: "assets/backgrounds/blue.jpg"
    mode: crop

    
  # Solid Color Backgrounds
  - type: solid
    color: [255, 255, 255]  # White
  - type: solid
    color: [240, 240, 240]  # Light gray
  - type: solid
    color: [200, 220, 255]  # Light blue
  - type: solid
    color: [255, 248, 220]  # Cream
    
  # Gradient Backgrounds
  - type: gradient
    start_color: [224, 255, 255]  # Light Cyan Blue
    end_color: [240, 255, 240]    # Light Mint Green
    direction: vertical
  - type: gradient
    start_color: [224, 255, 255]  # Light Cyan Blue
    end_color: [240, 255, 240]    # Light Mint Green
    direction: diagonal
  - type: gradient
    start_color: [173, 216, 230]  # Pastel Blue
    end_color: [152, 251, 152]    # Pale Seafoam Green
    direction: horizontal
    
  # Texture Backgrounds
  - type: texture
    base_color: [240, 240, 240]
    noise_level: 6
  - type: texture
    base_color: [255, 248, 220]
    noise_level: 15
  - type: texture
    base_color: [230, 230, 255]
    noise_level: 10

text_renderers:
  - type: horizontal
    weight: 1.0

text_placements:
  - type: center
  - type: random
  # - type: page_number
  # - type: page_title

augmentations: []


layout:
  type: simple
  padding: 50
  max_width: 600
  max_height: 200

output:
  images_dir: outputs/images
  metadata_file: outputs/metadata.jsonl

dataset:
  source: csv
  path: data/input.csv